[project]
name = "qa-mcp-server"
version = "0.1.0"
description = "A small MCP server that gives AI assistants practical QA tools: test data, boundary values and failure triage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qa-mcp-server = "qa_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
